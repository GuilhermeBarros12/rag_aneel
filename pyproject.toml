[project]
name = "rag-aneel"
version = "0.2.0"
description = "RAG sobre atos regulatórios da ANEEL, com avaliação medida"
readme = "README.md"
license = { file = "LICENSE" }
# numpy 2.4 exige Python 3.11 ou mais novo. As dependências ficam em requirements.txt.
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Só erros de verdade: sintaxe, nomes indefinidos, imports e variáveis sem uso
select = ["E4", "E7", "E9", "F"]
# E741 reclama de variáveis chamadas "l"; aqui "l" é sempre "linha"
ignore = ["E741"]
